repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog
        description: Detect secrets in your data.
        entry: "pre-commit-scripts/runner.sh"
        language: script
        stages: ["pre-commit", "pre-push"]
        always_run: true
        pass_filenames: false
  - repo: local
    hooks:
      - id: post-commit
        name: Post Commit
        description: Run post-commit scripts.
        entry: "post-commit-scripts/runner.sh"
        language: script
        stages: ["post-commit"]
        always_run: true
        pass_filenames: false
        verbose: true
