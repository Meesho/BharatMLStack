<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <style>
    .title { font-size: 34px; font-weight: 600; fill: #111; stroke: none; letter-spacing: 0.5px; }
    .subtitle { font-size: 18px; font-weight: 400; fill: #555; stroke: none; }
    .box-label { font-size: 22px; font-weight: 600; fill: #111; stroke: none; text-anchor: middle; }
    .box-sub { font-size: 15px; font-weight: 400; fill: #555; stroke: none; text-anchor: middle; }
    .edge-label { font-size: 15px; font-weight: 500; fill: #333; stroke: none; }
    .box { fill: #fff; stroke: #111; stroke-width: 1.8; }
    .edge { fill: none; stroke: #111; stroke-width: 1.8; }
    .edge-thick { fill: none; stroke: #111; stroke-width: 3; }
    .legend { font-size: 15px; fill: #666; stroke: none; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
    <marker id="arrow-thick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="120" y="110" class="title">RetrieveModelScore request lifecycle</text>
  <text x="120" y="148" class="subtitle">single call · features → inference → post-processing → response</text>

  <!-- Client -->
  <g>
    <rect x="140" y="490" width="240" height="100" rx="8" class="box"/>
    <text x="260" y="530" class="box-label">grpcui / client</text>
    <text x="260" y="556" class="box-sub">localhost:8096</text>
  </g>

  <!-- Inferflow (orchestrator) -->
  <g>
    <rect x="560" y="490" width="300" height="100" rx="8" class="box"/>
    <text x="710" y="530" class="box-label">Inferflow</text>
    <text x="710" y="556" class="box-sub">DAG: fetch → score → scale</text>
  </g>

  <!-- Fan-out targets -->
  <g>
    <rect x="1060" y="320" width="260" height="100" rx="8" class="box"/>
    <text x="1190" y="360" class="box-label">ONFS</text>
    <text x="1190" y="386" class="box-sub">3 FP16 features / id</text>
  </g>
  <g>
    <rect x="1060" y="490" width="260" height="100" rx="8" class="box"/>
    <text x="1190" y="530" class="box-label">Predator</text>
    <text x="1190" y="556" class="box-sub">raw score / row</text>
  </g>
  <g>
    <rect x="1060" y="660" width="260" height="100" rx="8" class="box"/>
    <text x="1190" y="700" class="box-label">Numerix</text>
    <text x="1190" y="726" class="box-sub">a@FP32 · 0.2</text>
  </g>

  <!-- Response -->
  <g>
    <rect x="1520" y="490" width="280" height="100" rx="8" class="box"/>
    <text x="1660" y="530" class="box-label">Response</text>
    <text x="1660" y="556" class="box-sub">final_score per id</text>
  </g>

  <!-- Request in -->
  <line x1="380" y1="540" x2="558" y2="540" class="edge-thick" marker-end="url(#arrow-thick)"/>
  <text x="388" y="526" class="edge-label">RetrieveModelScore</text>
  <text x="388" y="566" class="edge-label">{entity, ids, modelConfigId}</text>

  <!-- Inferflow → ONFS (step 1) -->
  <path d="M 860 510 Q 960 440 1058 375" class="edge" marker-end="url(#arrow)"/>
  <text x="870" y="450" class="edge-label">1 · retrieve features</text>

  <!-- Inferflow → Predator (step 2) -->
  <line x1="860" y1="540" x2="1058" y2="540" class="edge" marker-end="url(#arrow)"/>
  <text x="895" y="528" class="edge-label">2 · infer raw score</text>

  <!-- Inferflow → Numerix (step 3) -->
  <path d="M 860 570 Q 960 640 1058 705" class="edge" marker-end="url(#arrow)"/>
  <text x="870" y="650" class="edge-label">3 · scale ( × 0.2 )</text>

  <!-- Returns back to Inferflow -->
  <path d="M 1058 345 Q 960 330 860 505" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M 1058 540 Q 960 540 860 540" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M 1058 735 Q 960 750 860 575" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Inferflow → Response -->
  <line x1="1320" y1="540" x2="1518" y2="540" class="edge-thick" marker-end="url(#arrow-thick)"/>
  <text x="1340" y="526" class="edge-label">aggregated result</text>

  <!-- Legend -->
  <g transform="translate(140, 880)">
    <text x="0" y="0" class="legend" font-weight="600">Legend</text>
    <line x1="0" y1="24" x2="50" y2="24" class="edge-thick" marker-end="url(#arrow-thick)"/>
    <text x="60" y="29" class="legend">request / response</text>
    <line x1="260" y1="24" x2="310" y2="24" class="edge" marker-end="url(#arrow)"/>
    <text x="320" y="29" class="legend">internal call</text>
    <line x1="490" y1="24" x2="540" y2="24" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="550" y="29" class="legend">return value</text>
  </g>

</svg>
