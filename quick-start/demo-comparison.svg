<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <style>
    .title { font-size: 40px; font-weight: 600; fill: #111; stroke: none; letter-spacing: 0.5px; }
    .subtitle { font-size: 20px; font-weight: 400; fill: #555; stroke: none; }
    .card-label { font-size: 14px; font-weight: 600; fill: #777; stroke: none; letter-spacing: 2px; text-transform: uppercase; }
    .card-title { font-size: 26px; font-weight: 600; fill: #111; stroke: none; }
    .card-body { font-size: 17px; font-weight: 400; fill: #333; stroke: none; }
    .card { fill: #fff; stroke: #111; stroke-width: 1.8; }
    .col-head { font-size: 22px; font-weight: 600; fill: #111; stroke: none; text-anchor: middle; }
    .theme { font-size: 19px; font-weight: 600; fill: #111; stroke: none; }
    .cell { font-size: 16px; font-weight: 400; fill: #222; stroke: none; }
    .mark-yes { font-size: 22px; font-weight: 700; fill: #111; stroke: none; text-anchor: middle; }
    .mark-no  { font-size: 22px; font-weight: 400; fill: #aaa; stroke: none; text-anchor: middle; }
    .mark-partial { font-size: 22px; font-weight: 600; fill: #666; stroke: none; text-anchor: middle; }
    .line { stroke: #ddd; stroke-width: 1; }
    .line-strong { stroke: #111; stroke-width: 1.5; }
    .section-divider { stroke: #bbb; stroke-width: 1; stroke-dasharray: 6 5; }
    .legend { font-size: 15px; fill: #555; stroke: none; }
    .footer { font-size: 16px; fill: #555; stroke: none; font-style: italic; }
    .section-title { font-size: 26px; font-weight: 600; fill: #111; stroke: none; }
  </style>

  <!-- =================== TOP: TITLE + 3 EXPLAINER CARDS =================== -->
  <text x="120" y="90" class="title">BharatMLStack vs MLflow</text>
  <text x="120" y="124" class="subtitle">complementary, not competing — they cover different layers of the ML lifecycle</text>

  <!-- Three stacked cards, full-width -->
  <!-- Card 1 -->
  <g>
    <rect x="120" y="180" width="1680" height="150" rx="10" class="card"/>
    <text x="152" y="218" class="card-label">OFFLINE TOOL</text>
    <text x="152" y="254" class="card-title">MLflow lives with your data scientists</text>
    <text x="152" y="288" class="card-body">Tracks experiments, compares metrics across runs, versions trained models in a registry, packages artifacts for handoff.</text>
    <text x="152" y="312" class="card-body">Answers: "which run had the best AUC?" · "what's the current production version of this model?"</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="120" y="354" width="1680" height="150" rx="10" class="card"/>
    <text x="152" y="392" class="card-label">ONLINE RUNTIME</text>
    <text x="152" y="428" class="card-title">BharatMLStack lives in your production request path</text>
    <text x="152" y="462" class="card-body">Fetches fresh features from a low-latency store, calls the inference server, post-processes scores, returns a prediction under a latency SLA.</text>
    <text x="152" y="486" class="card-body">Answers: "given this user right now, what's the score?"</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="120" y="528" width="1680" height="150" rx="10" class="card"/>
    <text x="152" y="566" class="card-label">HOW THEY FIT</text>
    <text x="152" y="602" class="card-title">Complementary, not competing</text>
    <text x="152" y="636" class="card-body">MLflow stops where training ends. BharatMLStack starts where serving begins.</text>
    <text x="152" y="660" class="card-body">In most production setups you want both: MLflow for the lab, BharatMLStack for the front line.</text>
  </g>

  <!-- Divider between explainer and lifecycle -->
  <line x1="120" y1="730" x2="1800" y2="730" class="section-divider"/>

  <!-- =================== MIDDLE: LIFECYCLE PIPELINE =================== -->
  <text x="120" y="790" class="section-title">ML lifecycle — where each fits</text>

  <defs>
    <marker id="lc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
  </defs>

  <!-- Zone bands (drawn first so stages sit on top) -->
  <!-- MLflow zone: train, track, register, package (stages 1–4, spanning stage centers 240..1080) -->
  <rect x="170" y="870" width="910" height="120" rx="8" fill="#f5f5f5" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="625" y="860" font-size="17" font-weight="600" fill="#111" stroke="none" text-anchor="middle">MLflow zone</text>

  <!-- BharatMLStack zone: deploy, serve, monitor, retrain (stages 5–8, spanning 1120..1960) -->
  <rect x="1120" y="870" width="700" height="120" rx="8" fill="#f5f5f5" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="1470" y="860" font-size="17" font-weight="600" fill="#111" stroke="none" text-anchor="middle">BharatMLStack zone</text>

  <!-- Stage boxes: 8 stages, centers at y=930. x-centers: 240, 450, 660, 870, 1220, 1390, 1560, 1730 -->
  <!-- Stage 1: train -->
  <g>
    <rect x="172" y="900" width="165" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="254" y="937" font-size="18" font-weight="600" fill="#111" stroke="none" text-anchor="middle">train</text>
  </g>
  <!-- Stage 2: track -->
  <g>
    <rect x="352" y="900" width="165" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="434" y="937" font-size="18" font-weight="600" fill="#111" stroke="none" text-anchor="middle">track</text>
  </g>
  <!-- Stage 3: register -->
  <g>
    <rect x="532" y="900" width="165" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="614" y="937" font-size="18" font-weight="600" fill="#111" stroke="none" text-anchor="middle">register</text>
  </g>
  <!-- Stage 4: package -->
  <g>
    <rect x="712" y="900" width="165" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="794" y="937" font-size="18" font-weight="600" fill="#111" stroke="none" text-anchor="middle">package</text>
  </g>
  <!-- Stage 5: deploy (first in Bharat zone) -->
  <g>
    <rect x="1132" y="900" width="155" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="1209" y="937" font-size="18" font-weight="600" fill="#111" stroke="none" text-anchor="middle">deploy</text>
  </g>
  <!-- Stage 6: serve -->
  <g>
    <rect x="1302" y="900" width="155" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="1379" y="937" font-size="18" font-weight="600" fill="#111" stroke="none" text-anchor="middle">serve</text>
  </g>
  <!-- Stage 7: monitor -->
  <g>
    <rect x="1472" y="900" width="155" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="1549" y="937" font-size="18" font-weight="600" fill="#111" stroke="none" text-anchor="middle">monitor</text>
  </g>
  <!-- Stage 8: retrain -->
  <g>
    <rect x="1642" y="900" width="155" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.6"/>
    <text x="1719" y="937" font-size="18" font-weight="600" fill="#111" stroke="none" text-anchor="middle">retrain</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="337" y1="930" x2="350" y2="930" stroke="#111" stroke-width="1.6" marker-end="url(#lc-arrow)"/>
  <line x1="517" y1="930" x2="530" y2="930" stroke="#111" stroke-width="1.6" marker-end="url(#lc-arrow)"/>
  <line x1="697" y1="930" x2="710" y2="930" stroke="#111" stroke-width="1.6" marker-end="url(#lc-arrow)"/>
  <!-- Handoff arrow (thicker, crosses zones) -->
  <line x1="877" y1="930" x2="1130" y2="930" stroke="#111" stroke-width="2.5" marker-end="url(#lc-arrow)"/>
  <line x1="1287" y1="930" x2="1300" y2="930" stroke="#111" stroke-width="1.6" marker-end="url(#lc-arrow)"/>
  <line x1="1457" y1="930" x2="1470" y2="930" stroke="#111" stroke-width="1.6" marker-end="url(#lc-arrow)"/>
  <line x1="1627" y1="930" x2="1640" y2="930" stroke="#111" stroke-width="1.6" marker-end="url(#lc-arrow)"/>

  <!-- Handoff marker: caret + label below the handoff arrow -->
  <g transform="translate(1003, 1000)">
    <path d="M -10 0 L 0 -12 L 10 0 Z" fill="#111" stroke="none"/>
    <text x="0" y="22" font-size="16" font-weight="600" fill="#111" stroke="none" text-anchor="middle">handoff point</text>
    <text x="0" y="42" font-size="14" font-weight="400" fill="#555" stroke="none" text-anchor="middle">packaged model artifact crosses the boundary</text>
  </g>

  <!-- Feedback loop: monitor → retrain → train (long arc back) -->
  <path d="M 1719 960 Q 1719 1090 960 1090 Q 254 1090 254 965" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#lc-arrow)"/>
  <text x="960" y="1110" font-size="14" font-style="italic" fill="#555" stroke="none" text-anchor="middle">feedback loop — predictions &amp; ground truth fuel the next training run</text>

  <!-- Divider between lifecycle and table -->
  <line x1="120" y1="1160" x2="1800" y2="1160" class="section-divider"/>

  <!-- =================== BOTTOM: COMPARISON TABLE =================== -->
  <text x="120" y="1220" class="section-title">Capability breakdown</text>

  <!-- Column headers -->
  <line x1="120" y1="1250" x2="1800" y2="1250" class="line-strong"/>
  <text x="120" y="1278" class="theme">Theme</text>
  <text x="1020" y="1278" class="col-head">BharatMLStack</text>
  <text x="1500" y="1278" class="col-head">MLflow</text>
  <line x1="120" y1="1298" x2="1800" y2="1298" class="line-strong"/>

  <!-- Row 1: Experiment tracking -->
  <g>
    <text x="120" y="1346" class="theme">Experiment tracking</text>
    <text x="120" y="1372" class="cell">metrics, params, run history</text>
    <text x="1020" y="1358" class="mark-no">—</text>
    <text x="1500" y="1358" class="mark-yes">✓ core</text>
    <line x1="120" y1="1398" x2="1800" y2="1398" class="line"/>
  </g>

  <!-- Row 2: Model registry & packaging -->
  <g>
    <text x="120" y="1446" class="theme">Model registry &amp; packaging</text>
    <text x="120" y="1472" class="cell">versioning, stages, MLmodel flavors</text>
    <text x="1020" y="1458" class="mark-no">—</text>
    <text x="1500" y="1458" class="mark-yes">✓ core</text>
    <line x1="120" y1="1498" x2="1800" y2="1498" class="line"/>
  </g>

  <!-- Row 3: Feature store (online) -->
  <g>
    <text x="120" y="1546" class="theme">Online feature store</text>
    <text x="120" y="1572" class="cell">low-latency retrieval, Kafka ingestion, caching</text>
    <text x="1020" y="1558" class="mark-yes">✓ ONFS</text>
    <text x="1500" y="1558" class="mark-no">—</text>
    <line x1="120" y1="1598" x2="1800" y2="1598" class="line"/>
  </g>

  <!-- Row 4: Model serving -->
  <g>
    <text x="120" y="1646" class="theme">Production model serving</text>
    <text x="120" y="1672" class="cell">high-throughput inference, batching, multi-model</text>
    <text x="1020" y="1658" class="mark-yes">✓ Predator (Triton)</text>
    <text x="1500" y="1658" class="mark-partial">~ FastAPI wrapper</text>
    <line x1="120" y1="1698" x2="1800" y2="1698" class="line"/>
  </g>

  <!-- Row 5: Inference orchestration / DAG -->
  <g>
    <text x="120" y="1746" class="theme">Inference orchestration</text>
    <text x="120" y="1772" class="cell">DAG: feature fetch → score → post-process</text>
    <text x="1020" y="1758" class="mark-yes">✓ Inferflow + Numerix</text>
    <text x="1500" y="1758" class="mark-no">—</text>
    <line x1="120" y1="1798" x2="1800" y2="1798" class="line"/>
  </g>

  <!-- Row 6: Runtime config / hot-reload -->
  <g>
    <text x="120" y="1846" class="theme">Runtime config &amp; hot-reload</text>
    <text x="120" y="1872" class="cell">per-request routing, etcd-driven live updates</text>
    <text x="1020" y="1858" class="mark-yes">✓ etcd + Trufflebox</text>
    <text x="1500" y="1858" class="mark-partial">~ manual REST</text>
    <line x1="120" y1="1898" x2="1800" y2="1898" class="line"/>
  </g>

  <!-- Row 7: Vector / embedding search -->
  <g>
    <text x="120" y="1946" class="theme">Vector / embedding search</text>
    <text x="120" y="1972" class="cell">similarity, candidate generation</text>
    <text x="1020" y="1958" class="mark-yes">✓ Skye</text>
    <text x="1500" y="1958" class="mark-no">—</text>
    <line x1="120" y1="1998" x2="1800" y2="1998" class="line"/>
  </g>

  <!-- Row 8: Admin UI -->
  <g>
    <text x="120" y="2046" class="theme">Admin UI</text>
    <text x="120" y="2072" class="cell">console for what exactly?</text>
    <text x="1020" y="2058" class="mark-yes">✓ Trufflebox (runtime)</text>
    <text x="1500" y="2058" class="mark-yes">✓ MLflow UI (offline)</text>
    <line x1="120" y1="2090" x2="1800" y2="2090" class="line-strong"/>
  </g>

  <!-- Legend -->
  <g transform="translate(120, 2114)">
    <text x="0" y="0" class="legend"><tspan font-weight="700">✓</tspan> first-class    <tspan font-weight="600" fill="#666">~</tspan> partial / weak    <tspan fill="#aaa">—</tspan> not in scope</text>
  </g>
</svg>
